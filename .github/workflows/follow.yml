name: Follow FolderSkin's releases

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the cask and the formula to the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/bump.py
      - name: Commit and push
        run: |
          if git diff --quiet -- Casks Formula; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula
          git commit -m "Follow $(cat .github/.bumped)"
          git push
